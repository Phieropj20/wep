<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Localsito - Catálogo de Productos</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f0f4f8; /* Light blue-gray background */
            color: #333;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        /* Custom styles for active navigation link */
        .nav-link.active {
            background-color: #4f46e5; /* Tailwind indigo-600 */
            color: white;
        }
        .section-content {
            animation: fadeIn 0.5s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .product-card {
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: transform 0.2s ease-in-out;
        }
        .product-card:hover {
            transform: translateY(-5px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header and Navigation -->
    <header class="bg-gradient-to-r from-indigo-600 to-purple-700 text-white shadow-lg py-4">
        <div class="container flex justify-between items-center">
            <h1 class="text-4xl font-extrabold tracking-tight">Localsito</h1>
            <nav>
                <ul class="flex space-x-6">
                    <li><a href="#home" class="nav-link px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors active" data-section="home">Inicio</a></li>
                    <li><a href="#products" class="nav-link px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors" data-section="products">Productos</a></li>
                    <li><a href="#contact" class="nav-link px-4 py-2 rounded-lg hover:bg-indigo-700 transition-colors" data-section="contact">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="content-area" class="flex-grow container mt-8 p-6 bg-white rounded-xl shadow-lg">
        <!-- Content will be dynamically loaded here -->
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-6 mt-12">
        <div class="container text-center">
            <p>&copy; 2025 Localsito. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script>
        // Sample product data
        const products = [
            { id: 1, name: 'Café Premium', description: 'Café orgánico de alta calidad, aroma intenso.', price: '12.50', imageUrl: 'https://placehold.co/400x300/A78BFA/ffffff?text=Caf%C3%A9' },
            { id: 2, name: 'Pan Artesanal', description: 'Pan fresco hecho a mano, sin conservantes.', price: '3.00', imageUrl: 'https://placehold.co/400x300/8B5CF6/ffffff?text=Pan' },
            { id: 3, name: 'Miel de Abeja Pura', description: 'Miel natural recolectada localmente.', price: '8.75', imageUrl: 'https://placehold.co/400x300/6D28D9/ffffff?text=Miel' },
            { id: 4, name: 'Mermelada Casera', description: 'Mermelada de frutas de temporada, hecha en casa.', price: '5.20', imageUrl: 'https://placehold.co/400x300/5B21B6/ffffff?text=Mermelada' },
            { id: 5, name: 'Jugo Natural', description: 'Jugo de naranja recién exprimido, 100% natural.', price: '4.00', imageUrl: 'https://placehold.co/400x300/4C1D95/ffffff?text=Jugo' },
            { id: 6, name: 'Galletas de Avena', description: 'Deliciosas galletas de avena con chispas de chocolate.', price: '6.50', imageUrl: 'https://placehold.co/400x300/3B0764/ffffff?text=Galletas' }
        ];

        const contentArea = document.getElementById('content-area');
        const navLinks = document.querySelectorAll('.nav-link');

        // Function to render the Home section
        function renderHome() {
            contentArea.innerHTML = `
                <div class="section-content text-center py-10">
                    <h2 class="text-5xl font-extrabold text-indigo-700 mb-6">Bienvenido a Localsito</h2>
                    <p class="text-xl text-gray-700 leading-relaxed max-w-3xl mx-auto">
                        Descubre una selección única de productos frescos y artesanales, directamente de productores locales.
                        En Localsito, valoramos la calidad, la tradición y el apoyo a nuestra comunidad. ¡Explora nuestro catálogo y encuentra algo especial!
                    </p>
                    <div class="mt-8">
                        <img src="https://placehold.co/800x400/9333ea/ffffff?text=Tienda+Local" alt="Tienda Local" class="rounded-lg shadow-md mx-auto">
                    </div>
                    <button onclick="navigate('products')" class="mt-10 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-8 rounded-full shadow-lg transform hover:scale-105 transition-all duration-300">
                        Ver Productos
                    </button>
                </div>
            `;
        }

        // Function to render the Products section
        function renderProducts() {
            let productsHtml = '<div class="section-content">';
            productsHtml += '<h2 class="text-4xl font-bold text-indigo-700 mb-8 text-center">Nuestros Productos</h2>';
            productsHtml += '<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">';
            products.forEach(product => {
                productsHtml += `
                    <div class="product-card bg-white rounded-lg p-6 flex flex-col items-center text-center border border-gray-200">
                        <img src="${product.imageUrl}" alt="${product.name}" class="w-full h-48 object-cover rounded-md mb-4">
                        <h3 class="text-2xl font-semibold text-gray-800 mb-2">${product.name}</h3>
                        <p class="text-gray-600 mb-4 flex-grow">${product.description}</p>
                        <p class="text-indigo-600 text-3xl font-bold">$${product.price}</p>
                        <button class="mt-4 bg-purple-600 hover:bg-purple-700 text-white font-bold py-2 px-6 rounded-full shadow-md transform hover:scale-105 transition-all duration-300">
                            Añadir al Carrito
                        </button>
                    </div>
                `;
            });
            productsHtml += '</div></div>';
            contentArea.innerHTML = productsHtml;
        }

        // Function to render the Contact section
        function renderContact() {
            contentArea.innerHTML = `
                <div class="section-content text-center py-10">
                    <h2 class="text-4xl font-bold text-indigo-700 mb-8">Contáctanos</h2>
                    <p class="text-lg text-gray-700 mb-6">
                        ¿Tienes alguna pregunta, sugerencia o simplemente quieres saludar? ¡No dudes en contactarnos!
                    </p>
                    <div class="max-w-md mx-auto bg-gray-50 p-8 rounded-lg shadow-md border border-gray-200">
                        <form class="space-y-6">
                            <div>
                                <label for="name" class="block text-left text-gray-800 text-sm font-medium mb-1">Nombre:</label>
                                <input type="text" id="name" name="name" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Tu Nombre">
                            </div>
                            <div>
                                <label for="email" class="block text-left text-gray-800 text-sm font-medium mb-1">Correo Electrónico:</label>
                                <input type="email" id="email" name="email" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="tu.email@ejemplo.com">
                            </div>
                            <div>
                                <label for="message" class="block text-left text-gray-800 text-sm font-medium mb-1">Mensaje:</label>
                                <textarea id="message" name="message" rows="5" class="w-full px-4 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Tu Mensaje..."></textarea>
                            </div>
                            <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-6 rounded-full shadow-lg transform hover:scale-105 transition-all duration-300">
                                Enviar Mensaje
                            </button>
                        </form>
                    </div>
                    <div class="mt-8 text-gray-700">
                        <p><strong>Teléfono:</strong> +123 456 7890</p>
                        <p><strong>Email:</strong> info@localsito.com</p>
                        <p><strong>Dirección:</strong> Calle Falsa 123, Ciudad Ejemplo, País</p>
                    </div>
                </div>
            `;
        }

        // Function to navigate between sections
        function navigate(section) {
            // Update active class on navigation links
            navLinks.forEach(link => {
                if (link.dataset.section === section) {
                    link.classList.add('active');
                } else {
                    link.classList.remove('active');
                }
            });

            // Render the content for the selected section
            switch (section) {
                case 'home':
                    renderHome();
                    break;
                case 'products':
                    renderProducts();
                    break;
                case 'contact':
                    renderContact();
                    break;
                default:
                    renderHome(); // Default to home
            }

            // Update URL hash without reloading the page
            history.pushState(null, '', `#${section}`);
        }

        // Event listeners for navigation links
        navLinks.forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault(); // Prevent default link behavior
                const section = e.target.dataset.section;
                navigate(section);
            });
        });

        // Handle initial load based on URL hash
        document.addEventListener('DOMContentLoaded', () => {
            const initialHash = window.location.hash.substring(1); // Remove '#'
            if (initialHash) {
                navigate(initialHash);
            } else {
                navigate('home'); // Default to home if no hash
            }
        });
    </script>
</body>
</html>
